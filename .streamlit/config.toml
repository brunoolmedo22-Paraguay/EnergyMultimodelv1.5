[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Identidade visual SEEDS2 — paleta NEUTRA da Partitura V2 (Piso 3D-B2-A, direção aprovada pelo responsável): superfícies
# cinza-claras, tinta quase preta como cor de ação; as cores ficam reservadas aos dados (séries). Sem fontes ou recursos
# remotos. As cores categóricas dos gráficos nativos NÃO mudaram.
[theme]
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"
headingFontWeights = [700, 650, 600]
baseRadius = "0.75rem"
buttonRadius = "999px"
showWidgetBorder = true

[theme.light]
primaryColor = "#1F1F1F"
backgroundColor = "#F4F4F2"
secondaryBackgroundColor = "#E9E9E6"
textColor = "#171717"
borderColor = "#D6D6D2"
linkColor = "#2A5F8F"
dataframeHeaderBackgroundColor = "#E6E6E3"
chartCategoricalColors = ["#0E7C86", "#2F6FED", "#E0891E", "#7A4FD1", "#D1495B", "#3C9D5D", "#5B6B7C"]

[theme.dark]
primaryColor = "#8B7CFF"
backgroundColor = "#0F0F0F"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F3F3F1"
borderColor = "#333333"
linkColor = "#8DB8E8"
dataframeHeaderBackgroundColor = "#222222"
chartCategoricalColors = ["#2EC4B6", "#6E9BFF", "#F2A541", "#A98BFF", "#FF6B81", "#5FD08A", "#93A4B5"]
